# HPCG on Casper's high-throughput Genoa nodes.
#
# The plumbing check this file used to be has served its purpose: the run of
# 2026-09-03 proved the module bootstrap, the host Open MPI displacement, the
# binds and the whole record-and-collect path work on Casper.  What it could not
# do is mean anything, for two reasons that are now both fixable.
#
#   it did not choose its hardware   the request named no processor, and the
#                                    high-throughput pool -- 64 Genoa, 50
#                                    Cascade Lake, 4 Skylake -- handed back
#                                    Genoa.  sites/casper.yaml now carries
#                                    node.select: cpu_type=genoa, so the nodes
#                                    are the ones it describes.
#   it shared its nodes              asking for 8 of 64 CPUs got 8 LOGICAL CPUs
#                                    beside other people's work: every rank was
#                                    pinned to one SMT sibling rather than a
#                                    whole core, and the checker warned on all
#                                    nine runs.  exclusive: true now claims the
#                                    node.
#
# The cost is queue time.  These nodes are shared by design, so the scheduler
# has to drain other people's small jobs from two of them before this starts.
# That is the price of a number anybody can compare.
#
#     ../validate casper-hpcg              expand it, check it, submit nothing
#     ../submit   casper-hpcg --account <PROJECT>
#
# THE PLACEMENTS
#
# An EPYC 9554 is single-socket, 64 cores, 8 cores per L3, one NUMA domain over
# the whole node.  So two of Derecho's three questions survive and the third
# does not:
#
#   pureMPI  64 x 1   one rank per core
#   ccx       8 x 8   one rank per last-level cache, 8 cores -- the same
#                     question Derecho's `ccd` cell asks of a Milan CCD
#   (numa)            would be 1 x 64, the whole node: degenerate on a
#                     single-domain part, so it is not asked
#
# Note this is NOT the reasoning that applies to Casper's Cascade Lake nodes,
# where the cache and the NUMA domain are both the 18-core socket and the two
# questions collapse into one.  Which node type you are on decides which sweep
# is meaningful, which is the argument for sub-clusters in one sentence.
schema: 1
cluster: casper

defaults:
  nodes: 2
  walltime: "00:30:00"
  repeats: 3
  scale: node
  target_seconds: 60

# The openmpi half of the Derecho set.  Casper has no Cray MPICH ABI shim, so
# there is no way to give an mpich container the host's MPI here -- which is why
# sites/casper.yaml lists no mpich family, and why bench/validate refuses an
# mpich image for this site rather than queueing one that cannot run.
images:
  from_make: casper-hpcg

apps:
  - name: hpcg

# ranks_per_node x threads == 64 for both, which is what the geometry check
# requires of a node held exclusively.
placements:
  - {name: pureMPI, ranks_per_node: 64, threads: 1}    # one core per rank
  - {name: ccx,     ranks_per_node: 8,  threads: 8}    # one L3 per rank, 32 MB

omp_variants:
  - {name: percore, OMP_PROC_BIND: close, OMP_PLACES: cores}

sweep:
  matrix:  [images, apps, placements, omp_variants]
  per_job: [placements, omp_variants]
