name: Build and Smoketest HPCG App Images (GHCR)

#-------------------------------------------------------------------------------
# Pull published GHCR development images, build HPCG into derived app images,
# publish those app images, then run a tiny smoke test from the published result.
# This is deliberately separate from the image factory workflow: HPCG is an
# application workload that consumes the factory image contract, not a layer in
# the base development image.
#
# The default matrix mirrors the Derecho deployment set:
#     leap x {oneapi, gcc14, nvhpc} x {mpich, openmpi}
#-------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Base OS image tag component"
        type: choice
        required: true
        default: leap
        options:
          - leap
          - almalinux9
          - noble

      docker_repo:
        description: "Base image repository"
        type: string
        required: false
        default: "ghcr.io/kedziora-csg/hpcdev"

      apps_repo:
        description: "App image repository"
        type: string
        required: false
        default: "ghcr.io/kedziora-csg/hpcdev-apps"

      image_version:
        description: "Base image version tag suffix"
        type: string
        required: true
        default: "26.08"

      nranks:
        description: "MPI ranks for the tiny HPCG smoke run"
        type: number
        required: false
        default: 2

permissions:
  contents: read
  packages: write

jobs:
  hpcg-smoke:
    name: HPCG
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -elo pipefail {0}

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        arch: [x86_64]
        compiler: [oneapi, gcc14, nvhpc]
        mpi: [mpich, openmpi]

    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tag
        id: image
        run: |
          base_repo='${{ inputs.docker_repo }}'
          if [ -z "${base_repo}" ]; then
              base_repo='ghcr.io/${{ github.repository_owner }}/hpcdev'
          fi
          apps_repo='${{ inputs.apps_repo }}'
          if [ -z "${apps_repo}" ]; then
              apps_repo='ghcr.io/${{ github.repository_owner }}/hpcdev-apps'
          fi
          base_repo="$(printf '%s' "${base_repo}" | tr '[:upper:]' '[:lower:]')"
          apps_repo="$(printf '%s' "${apps_repo}" | tr '[:upper:]' '[:lower:]')"
          base_image="${base_repo}-${{ matrix.arch }}:${{ inputs.os }}-${{ matrix.compiler }}-${{ matrix.mpi }}-${{ inputs.image_version }}"
          app_image="${apps_repo}-${{ matrix.arch }}:${{ inputs.os }}-${{ matrix.compiler }}-${{ matrix.mpi }}-hpcg-${{ inputs.image_version }}"
          app_image_latest="${apps_repo}-${{ matrix.arch }}:${{ inputs.os }}-${{ matrix.compiler }}-${{ matrix.mpi }}-hpcg-latest"
          echo "base_image=${base_image}" | tee -a "${GITHUB_OUTPUT}"
          echo "app_image=${app_image}" | tee -a "${GITHUB_OUTPUT}"
          echo "app_image_latest=${app_image_latest}" | tee -a "${GITHUB_OUTPUT}"
          mkdir -p hpcg-smoke-logs

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull '${{ steps.image.outputs.base_image }}'

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Build and publish HPCG app image
        uses: docker/build-push-action@v7
        with:
          push: true
          load: false
          tags: |
            ${{ steps.image.outputs.app_image }}
            ${{ steps.image.outputs.app_image_latest }}
          provenance: mode=max
          sbom: true
          context: .
          file: containers/apps/hpcg/Dockerfile
          target: final
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.base_image }}
            MAKE_J_PROCS=2
            HPCG_RUN=0

      - name: Smoke-test published HPCG app image
        run: |
          tag='${{ inputs.os }}-${{ matrix.compiler }}-${{ matrix.mpi }}'
          docker run --rm \
            --env OMPI_MCA_opal_cuda_support=false \
            --env MPIR_CVAR_ENABLE_GPU=0 \
            --env OMP_NUM_THREADS=2 \
            --env NRANKS='${{ inputs.nranks }}' \
            '${{ steps.image.outputs.app_image }}' \
            bash -lc '
              set -e
              test -x /container/bin/xhpcg
              case "${MPI_FAMILY}" in
                  "openmpi"*) mpiexec_args="--map-by :OVERSUBSCRIBE" ;;
                  "mpich"*)   export MPIR_CVAR_ENABLE_GPU=0; mpiexec_args="" ;;
                  *)          mpiexec_args="" ;;
              esac
              smoke="/tmp/hpcg-smoke"
              rm -rf "${smoke}" && mkdir -p "${smoke}" && cd "${smoke}"
              printf "HPCG benchmark input file\nsmoke test -- NOT a valid HPCG result\n32 32 32\n5\n" > hpcg.dat
              mpiexec -n "${NRANKS}" ${mpiexec_args} /container/bin/xhpcg
              grep -hE "Final Summary::HPCG result is|GFLOP/s rating" HPCG-Benchmark*.txt
            ' 2>&1 | tee "hpcg-smoke-logs/${tag}.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hpcg-smoke-${{ inputs.os }}-${{ matrix.compiler }}-${{ matrix.mpi }}
          path: hpcg-smoke-logs/*.log
          if-no-files-found: warn