name: Build Derecho Image Set (GHCR)

#-------------------------------------------------------------------------------
# The blessed Derecho deployment set, published to GHCR:
#
#     leap x {oneapi, gcc14, nvhpc} x {mpich, openmpi}  = 6 images
#
#   leap    -- openSUSE Leap 15 is built from the same SLE 15 SP6 sources as
#              Derecho's host OS, so the container userspace matches the host.
#   oneapi  -- intel/2025.2.1 is the site default compiler.
#   gcc14   -- matches Derecho's gcc/14.3.0 module exactly (NOT `gcc`, which is
#              leap's system compiler).
#   nvhpc   -- the third compiler NCAR provides modules for.
#   mpich   -- only MPICH can be displaced by Cray MPICH's ABI shim.
#   znver3  -- Derecho is 2 x EPYC 7763 (Milan / Zen 3): AVX2 and FMA, no
#              AVX-512.  These six images are Derecho-only -- Casper uses the
#              almalinux9 set -- so targeting the CPU exactly costs nothing.
#              Set per compiler because the spelling differs (see the matrix).
#   openmpi -- the alternative, still unproven on Derecho.
#
# Consumed by containers/deploy/ncar-hpc: libexec/Makefile's `derecho` target
# builds the matching .sif files, and submit_placement_matrix.sh runs the sweep.
#
# WHY THIS IS A SEPARATE FILE, not a preset inside matrix-build-images-ghcr.yaml:
# narrowing that workflow's axes orphans its include: blocks.  GitHub turns every
# include entry that matches no surviving combination into a malformed standalone
# job -- with no arch, so the runner ternary sends it to a scarce ARM runner where
# it queues forever.  Narrowing to these 6 produced 6 real jobs plus 8 orphans.
# Here the axes and the include: entries are defined together, so they cannot
# drift apart.
#
# The compiler/mpi build args below MIRROR matrix-build-images.yaml, which is the
# authoritative source for versions.  Keep them in sync when bumping.
#-------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Base OS (leap matches Derecho's SLE 15 SP6 host)"
        type: choice
        required: true
        default: leap
        options:
          - leap
          - almalinux9
          - noble

      oneapi_version:
        description: "oneAPI version -- 2026.1.0 is the validated default, 2025.3.2 the fallback"
        type: choice
        required: true
        default: "2026.1.0"
        options:
          - "2026.1.0"
          - "2025.3.2"

      test:
        description: "Test Image"
        type: boolean
        required: false
        default: true

      publish:
        description: "Publish Image"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build-derecho-set:
    name: Build
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        compiler: [oneapi, gcc14, nvhpc]
        mpi: [mpich, openmpi]

        # Every include below names a value that EXISTS in the axes above, so
        # each one merges rather than creating a standalone job.  Adding a
        # compiler here means adding it to the axis list too.
        include:
          # oneAPI version is dispatch-selectable so a release can be A/B'd on Derecho
          # without editing this file.  Both component URLs must move together; they
          # come from the `cpp`/`ftn` entries of Spack's intel_oneapi_compilers
          # package.py (see CLAUDE.md -- the per-release UUID is not derivable).
          - compiler: oneapi
            compiler_build_args: |
              COMPILER_FAMILY=oneapi
              MARCH_FLAGS=-march=znver3
              ONEAPI_VERSION=${{ inputs.oneapi_version }}
              ONEAPI_CC_URL=${{ inputs.oneapi_version == '2026.1.0' && 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/eb43fd3f-7cff-46a4-ab14-a2d3b60c4899/intel-dpcpp-cpp-compiler-2026.1.0.118_offline.sh' || 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/0d61d48a-4fe8-4cb2-bd9d-94d2c19c6227/intel-dpcpp-cpp-compiler-2025.3.2.26_offline.sh' }}
              ONEAPI_FC_URL=${{ inputs.oneapi_version == '2026.1.0' && 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/87bd1c07-e474-4f38-9492-e44e15ea7a52/intel-fortran-compiler-2026.1.0.104_offline.sh' || 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/3e53d136-2870-4836-adb1-892b558fa34a/intel-fortran-compiler-2025.3.2.25_offline.sh' }}

          - compiler: gcc14
            compiler_build_args: |
              COMPILER_FAMILY=gcc
              GCC_VERSION=14.3.0
              MARCH_FLAGS=-march=znver3

          # Same target, different spelling: nvc rejects GNU's -march= and
          # silently ignores it, then falls back to -tp native -- the BUILD
          # runner's CPU -- producing a binary that SIGILLs on Derecho.
          - compiler: nvhpc
            compiler_build_args: |
              COMPILER_FAMILY=nvhpc
              MARCH_FLAGS=-tp=zen3
              NVHPC_VERSION=26.5
              NVHPC_URL=https://developer.download.nvidia.com/hpc-sdk/26.5/nvhpc_2026_265_Linux_x86_64_cuda_multi.tar.gz

          - mpi: openmpi
            mpi_build_args: |
              MPI_FAMILY=openmpi
              OPENMPI_VERSION=5.0.10

          - mpi: mpich
            mpi_build_args: |
              MPI_FAMILY=mpich
              MPICH_VERSION=5.0.1

    uses: ./.github/workflows/build-hpc-dev-image-ghcr.yaml
    with:
      # A SEPARATE repository from the portable factory images, because these
      # make a different promise.  Both this workflow and matrix-build-images-ghcr
      # build `leap-<compiler>-<mpi>`, and that one defaults to os: leap -- so
      # publishing both to .../hpcdev would leave one tag meaning either "runs
      # anywhere" or "needs Zen 3", depending on which ran last.  A different
      # contract deserves a different namespace, not a suffix on a shared one.
      #
      # Keep it FULLY QUALIFIED.  This field was once filled in as "kedziora",
      # an unqualified name that Docker resolves to Docker Hub's library/
      # namespace, so the build succeeded and then failed pushing cache to
      # library/kedziora-x86_64-cache with a 401.
      docker_repo: ghcr.io/${{ github.repository_owner }}/hpcdev-derecho
      os: ${{ inputs.os }}
      # Derecho CPU nodes are x86_64 and this set is CPU-only; GPU images are a
      # later axis (they need --nv, set_gpu_rank and an ngpus PBS select line).
      arch: x86_64
      runner: ubuntu-latest
      free_runner_space: true
      conda: true
      gpu: nogpu
      compiler: ${{ matrix.compiler }}
      compiler_build_args: ${{ matrix.compiler_build_args }}
      mpi: ${{ matrix.mpi }}
      mpi_build_args: ${{ matrix.mpi_build_args }}
      test: ${{ inputs.test }}
      publish: ${{ inputs.publish }}
      extra_build_args: |
        HDF5_VERSION=1.14.5
        HDF5_URL=https://github.com/HDFGroup/hdf5/releases/download/hdf5_1.14.5/hdf5-1.14.5.tar.gz
        NETCDF_C_VERSION=4.10.0
        NETCDF_FORTRAN_VERSION=4.6.3
        PNETCDF_VERSION=1.14.1
        PIO_VERSION=2.6.7
        PIO_TAG=pio2_6_7
        FFTW_VERSION=3.3.10
        HEFFTE_VERSION=2.4.1

    secrets:
      registry_token: ${{ secrets.GITHUB_TOKEN }}
