# Casper -- a cluster of the NCAR site, and the reason this file has a header
# this long.
#
# What NCAR clusters share is one level up in ../ncar.yaml.  What is here is
# Casper: a different scheduler queue, no Cray anything, and hardware that is
# not one kind of thing.
#
# WHICH CASPER THIS DESCRIBES, AND HOW WE FOUND OUT
#
# Casper is not one machine.  `pbsnodes` reports seven processor types across
# its pools, and the high-throughput pool alone holds 64 Genoa, 50 Cascade Lake
# and 4 Skylake nodes.
#
# The first run (2026-09-03) asked for `ncpus=8` with no processor selector and
# landed on crhtc67, 73, 79 and 80 -- all AMD EPYC 9554, 64 cores, ONE socket,
# 8 cores per L3, one NUMA domain.  We had described the 36-core two-socket Xeon
# Gold 6240 nodes, having probed crhtc55 and taken the `crhtc` prefix to name one
# node type.  It does not.  So node.select now carries `cpu_type=genoa` and the
# geometry below is the nodes that actually answer.
#
#     crhtc55  36 cores  2 sockets  18 cores/L3  2 NUMA   Xeon Gold 6240
#     crhtc73  64 cores  1 socket    8 cores/L3  1 NUMA   EPYC 9554
#
# Both are described now, as the two entries of subclusters: below.
#
# WHAT THE FIRST RUN PROVED, AND WHAT IT DID NOT
#
# Proved: the module bootstrap works; the host Open MPI displaces the
# container's for all three compilers; the binds are sufficient; /proc plus
# UCX_POSIX_USE_PROC_LINK=n is enough for UCX inside the container; the app
# contract resolves; the placement checker, the results record and hpcrun/collect
# all work here.  `verified: true` refers to THAT, and to nothing about the
# numbers.
#
# Did not prove: that node.target_arch is right.  x86-64-v4 was declared for
# Cascade Lake and the run reported x86-64-v4 -- because Genoa has AVX-512 too.
# The check agreed for the wrong reason, which is worth remembering when reading
# the `cpu` line of a job log.
#
# The declared node: geometry was WRONG for the nodes we got, and it did not
# matter: probe_topology.sh read the real machine and every threshold came from
# that.  That is section 4's argument for probing rather than hardcoding,
# demonstrated rather than asserted.
#
# A NOTE ON THESE NODES AND MEASUREMENT
#
# High-throughput nodes are shared by design -- the documentation describes them
# as being for tasks using one or two CPUs.  A job that does not hold a whole
# node shares it with other tenants, whose work lands in your timings as noise
# you cannot see or subtract.  The first run also showed the second cost of
# sharing: asking for 8 ncpus on an SMT node gets 8 LOGICAL CPUs, so every rank
# was pinned to a single SMT sibling rather than a whole core, and the placement
# checker warned on all nine runs.  Comparable numbers need whole nodes.
schema: 1
site: ncar
cluster: casper
description: "NCAR Casper high-throughput nodes: 1 x 64-core AMD EPYC 9554 (Genoa), SMT on. The crhtc pool also holds 36-core Cascade Lake nodes -- see the header."
verified: true

scheduler:
  queue: casper
  walltime_max: "24:00:00"

# The openmpi half of Derecho's set, and nothing else: Casper's Genoa runs
# Derecho's Zen 3 builds, and with no mpich family under mpi: below, an mpich
# image is refused here rather than built for a cluster that cannot run it.
#
# The same Zen 3 builds, so the same target and the same spelling: sitegen
# --check refuses two clusters that name one target and spell it differently,
# because the tag would then mean whichever was built last.
images:
  os: leap
  compilers: [oneapi, gcc14, nvhpc]
  mpi: [openmpi]
  # heffte and blas: the seam study's probes, run here because these nodes
  # have AVX-512 and Derecho's do not.
  apps: [hpcg, heffte, blas]
  target: znver3
  march: {default: -march=znver3, nvhpc: -tp=zen3}

modules:
  # Beyond the site bootstrap.  Casper is a GPU cluster and its jobs want the
  # CUDA runtime; Derecho's CPU nodes do not.
  bootstrap:
    - module load cuda

  mpi_map:
    openmpi: openmpi

# Two of the high-throughput pool's node types, which is all that pool holds
# apart from four Skylake nodes.  Each entry states its node in full, because
# the two share almost nothing: one socket against two, 8 cores per L3 against
# 18, one NUMA domain against two.  An experiment picks one with `subcluster:`,
# and one that names none gets the default.
#
# ncpus is what PBS hands out, from `pbsnodes -a` on 2026-09-29: two cores of
# every htc node are held back for the operating system, so Genoa offers 62 of
# its 64 and Cascade Lake 34 of its 36.  The geometry still reasons in hardware
# cores; ncpus is what a request may ask for, and asking for more queues
# forever rather than failing.
#
# select carries cpu_type only, not the node's Qlist tag: those name EXECUTION
# queues, and a Casper job is submitted to the `casper` routing queue, which
# assigns one.  Selecting on Qlist would fight the router rather than direct it.
default_subcluster: htc-genoa

subclusters:
  htc-genoa:
    description: "High-throughput AMD EPYC 9554 (Genoa): 64 cores, one socket, SMT on"
    # Measured on crhtc73 with hpcrun/lib/probe_topology.sh during the first
    # run, 2026-09-03, and run on by every Casper job since.
    node:
      cores: 64
      smt: 2
      ncpus: 62
      sockets: 1              # single-socket Genoa, unlike the Cascade Lake nodes
      smt_stride: 64          # block layout: sibling of CPU c is c + 64
      cores_per_l3: 8         # one CCX, as on Derecho's Milan -- not the socket
      cores_per_numa: 64      # one NUMA domain: the whole node
      # Genoa has AVX-512.  So does Cascade Lake, which is why this value agreed
      # with the first run while the file described the wrong nodes.
      target_arch: x86-64-v4
      select: cpu_type=genoa
      topology: probe

  htc-cascadelake:
    description: "High-throughput Intel Xeon Gold 6240 (Cascade Lake): 2 x 18 cores, SMT on"
    # Measured on crhtc53 with probe_topology.sh, 2026-09-29, and confirmed the
    # same day by the first HPCG job here (6083942, crhtc53 and crhtc62): the
    # job's own probe agreed with every value below.
    node:
      cores: 36
      smt: 2
      ncpus: 34
      sockets: 2
      smt_stride: 36
      cores_per_l3: 18        # one L3 per socket
      cores_per_numa: 18      # one NUMA domain per socket
      target_arch: x86-64-v4
      select: cpu_type=cascadelake
      topology: probe

container:
  # Added to the site's /glade and /local_scratch.  /proc is bound here and not
  # on Derecho: UCX's POSIX transport reads other ranks' /proc links, which the
  # container namespace otherwise refuses.
  binds: [/proc]
  binds_if_present: [/run, /var/run]
  lib_dirs:
    - ${NCAR_ROOT_OPENMPI}/lib
    - /usr/lpp/mmfs/lib
    - /usr/lib64

# mpich is deliberately ABSENT.  Casper has no Cray PALS and no Cray MPICH ABI
# shim, so neither Derecho recipe applies, and the runner refuses such an image
# by name rather than queueing one that cannot run.  That is exactly why `mpi:`
# is never inherited from the site.
mpi:
  openmpi:
    launcher: openmpi
    overlay: host-openmpi
    # Set by NCAR's openmpi module, and named in lib_dirs above for the same
    # reason: expanded only once the module is loaded.
    root: '${NCAR_ROOT_OPENMPI}'
    env:
      UCX_POSIX_USE_PROC_LINK: n
    notes: |
      Verified 2026-09-03.  Note the host Open MPI version is not uniform across
      compilers here: gcc14 and nvhpc resolved to openmpi/5.0.8, oneapi to
      5.0.9, so a comparison across those images is also a comparison across two
      MPI versions.  Derecho gave 5.0.9 for all three.
