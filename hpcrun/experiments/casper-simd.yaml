# Seam study, test 1 (BenchmarkRunnerPlan.md, section 11 item 11): what FFTW's
# run-time-dispatched SIMD codelets are worth, and what AVX-512 adds over AVX2,
# on a node that has AVX-512.
#
# One image, three FFTWs behind the same HeFFTe driver:
#     base     the base image's libfftw3, built with no SIMD codelets
#     avx2     FFTW built here with --enable-sse2/avx/avx2
#     avx512   ... and --enable-avx512
# FFTW picks its codelets from CPUID at run time, so all three are portable.
#
# Run it on both node types of the htc pool:
#     ../submit casper-simd --account <PROJECT>                       # htc-genoa (Zen 4)
#     ../submit casper-simd --account <PROJECT> --subcluster htc-cascadelake
#
# 256^3 rather than Derecho's 512^3: about 1 GB in all, which a shared job's
# default memory share holds; the question here is AVX2 against AVX-512 on one
# node, not a comparison with Derecho.
#
# Shared nodes, so a plumbing-grade measurement: co-tenants are noise this
# cannot see.  Treat differences under about 5% as noise; repeat to check.
#
# 16 ranks x 2 "threads": the threads are not used by the app, they make each
# rank's binding two logical CPUs -- both SMT siblings of one core -- so no two
# ranks share a core's vector units.  With 16 x 1, PBS hands out 16 logical
# CPUs, which on these nodes can be 8 cores' sibling pairs.
schema: 2
cluster: casper
subcluster: htc-genoa

defaults:
  nodes: 1
  walltime: "00:20:00"
  repeats: 3
  scale: node
  exclusive: false
  allow_undersubscribed: true

images:
  list: [leap-gcc14-openmpi-heffte-znver3.sif]

apps:
  - {name: heffte, label: fftw-base,   env: {HEFFTE_BACKEND: fftw, HEFFTE_FFTW: base,   HEFFTE_N: 256}}
  - {name: heffte, label: fftw-avx2,   env: {HEFFTE_BACKEND: fftw, HEFFTE_FFTW: avx2,   HEFFTE_N: 256}}
  - {name: heffte, label: fftw-avx512, env: {HEFFTE_BACKEND: fftw, HEFFTE_FFTW: avx512, HEFFTE_N: 256}}

placements:
  - {name: rank-per-core, ranks_per_node: 16, threads: 2}

omp_variants:
  - {name: percore, OMP_PROC_BIND: close, OMP_PLACES: cores}

sweep:
  matrix:  [images, apps, placements, omp_variants]
  per_job: [placements, omp_variants]
