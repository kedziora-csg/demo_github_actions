# Seam study, test 2 (BenchmarkRunnerPlan.md, section 11 item 11): what AVX-512
# is worth to arithmetic-bound linear algebra (DGEMM, BLAS3) and to
# bandwidth-bound linear algebra (DGEMV, BLAS2), from ONE portable OpenBLAS
# built with DYNAMIC_ARCH.
#
# OPENBLAS_CORETYPE forces the kernel set on the same node:
#     auto        OpenBLAS's own pick from CPUID
#     haswell     AVX2 + FMA
#     skylakex    AVX-512
# extract records the core that actually ran, so an ignored override shows.
#
# And MKL against OpenBLAS, without MKL in the image: the mkl-* variants
# preload Casper's own oneMKL (the mkl/2025.2.0 module's libmkl_rt) into the
# container.  APPTAINERENV_LD_PRELOAD sets LD_PRELOAD inside the container
# only; /glade, where the module lives, is already bound.  MKL's CBLAS then
# answers the probe's calls instead of OpenBLAS's, and the probe asks the
# dynamic linker which library did, so each row says which ran -- and, for
# MKL, which of its per-ISA kernel libraries it loaded (avx512, avx2, ... or
# def, its generic one, which is what it chooses on AMD).
#     mkl-auto      MKL's own choice
#     mkl-avx2      MKL_ENABLE_INSTRUCTIONS=AVX2: held to AVX2
# The path is Casper's: a Derecho version names Derecho's module instead.
#
#     ../submit casper-blas --account <PROJECT>                       # htc-genoa (Zen 4)
#     ../submit casper-blas --account <PROJECT> --subcluster htc-cascadelake
#
# Shared nodes; see casper-simd.yaml for the noise caveat and why 16 x 1.
# The kernel sets are `variants:`, not separate apps, so all of them run in
# ONE job, on one node, one after another: on a shared node that is the only
# way the comparison is not swamped by which node each one landed on.
schema: 2
cluster: casper
subcluster: htc-genoa

defaults:
  nodes: 1
  walltime: "00:20:00"
  repeats: 5
  scale: node
  exclusive: false
  allow_undersubscribed: true

images:
  list: [leap-gcc14-openmpi-blas-znver3.sif]

# BLAS_M 4096 (128 MB per rank, still far past cache) rather than the 8192
# default, so 16 ranks fit a shared job's default memory share.
apps:
  - {name: blas, env: {BLAS_M: 4096}}
variants:
  - {name: auto}
  - {name: haswell,  env: {OPENBLAS_CORETYPE: Haswell}}
  - {name: skylakex, env: {OPENBLAS_CORETYPE: SkylakeX}}
  - name: mkl-auto
    env:
      APPTAINERENV_LD_PRELOAD: /glade/u/apps/casper/25.10/spack/opt/spack/intel-oneapi-mkl/2025.2.0/intel-oneapi-compilers/2025.2.1/e2rm/mkl/2025.2/lib/libmkl_rt.so.2
      MKL_THREADING_LAYER: SEQUENTIAL
  - name: mkl-avx2
    env:
      APPTAINERENV_LD_PRELOAD: /glade/u/apps/casper/25.10/spack/opt/spack/intel-oneapi-mkl/2025.2.0/intel-oneapi-compilers/2025.2.1/e2rm/mkl/2025.2/lib/libmkl_rt.so.2
      MKL_THREADING_LAYER: SEQUENTIAL
      MKL_ENABLE_INSTRUCTIONS: AVX2

placements:
  - {name: pureMPI, ranks_per_node: 16, threads: 1}

omp_variants:
  - {name: percore, OMP_PROC_BIND: close, OMP_PLACES: cores}

sweep:
  matrix:  [images, apps, placements, omp_variants, variants]
  per_job: [placements, omp_variants, variants]   # every variant on ONE node
