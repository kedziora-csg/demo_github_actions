# Seam study, test 2 (BenchmarkRunnerPlan.md, section 11 item 11): what AVX-512
# is worth to arithmetic-bound linear algebra (DGEMM, BLAS3) and to
# bandwidth-bound linear algebra (DGEMV, BLAS2), from ONE portable OpenBLAS
# built with DYNAMIC_ARCH.
#
# OPENBLAS_CORETYPE forces the kernel set on the same node:
#     auto        OpenBLAS's own pick from CPUID
#     haswell     AVX2 + FMA
#     skylakex    AVX-512
# extract records the core that actually ran, so an ignored override shows.
#
#     ../submit casper-blas --account <PROJECT>                       # htc-genoa (Zen 4)
#     ../submit casper-blas --account <PROJECT> --subcluster htc-cascadelake
#
# Shared nodes; see casper-simd.yaml for the noise caveat and why 16 x 2.
schema: 2
cluster: casper
subcluster: htc-genoa

defaults:
  nodes: 1
  walltime: "00:20:00"
  repeats: 3
  scale: node
  exclusive: false
  allow_undersubscribed: true

images:
  list: [leap-gcc14-openmpi-blas-znver3.sif]

# BLAS_M 4096 (128 MB per rank, still far past cache) rather than the 8192
# default, so 16 ranks fit a shared job's default memory share.
apps:
  - {name: blas, label: auto,                                     env: {BLAS_M: 4096}}
  - {name: blas, label: haswell,  env: {OPENBLAS_CORETYPE: Haswell,  BLAS_M: 4096}}
  - {name: blas, label: skylakex, env: {OPENBLAS_CORETYPE: SkylakeX, BLAS_M: 4096}}

placements:
  - {name: rank-per-core, ranks_per_node: 16, threads: 2}

omp_variants:
  - {name: percore, OMP_PROC_BIND: close, OMP_PLACES: cores}

sweep:
  matrix:  [images, apps, placements, omp_variants]
  per_job: [placements, omp_variants]
